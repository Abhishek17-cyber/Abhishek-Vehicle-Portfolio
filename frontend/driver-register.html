<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Job Registration - Fleet Management</title>
  
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.8)), url('images/truck.jpg') no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 2rem 0;
    }
    .container { margin: auto; }
  </style>
</head>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card glass-panel fade-in-up p-4 p-md-5">
          <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">Driver Job Registration</h2>
            <p class="text-muted">Register to find driving jobs and get hired by fleet owners.</p>
          </div>

          <div id="errorAlert" class="alert alert-danger d-none"></div>
          <div id="successAlert" class="alert alert-success d-none"></div>

          <form id="registerForm">
            <h5 class="border-bottom pb-2 mb-3">Account Details</h5>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required minlength="6">
              </div>
            </div>

            <h5 class="border-bottom pb-2 mb-3 mt-3">Personal Details</h5>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullName" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Mobile Number</label>
                <input type="tel" class="form-control" id="mobile" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Address</label>
                <textarea class="form-control" id="address" rows="1"></textarea>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Profile Photo (Optional)</label>
                <input type="file" class="form-control" id="profilePhoto" accept="image/*">
              </div>
            </div>

            <h5 class="border-bottom pb-2 mb-3 mt-3">Professional Info</h5>
            <div class="row">
              <div class="col-md-4 mb-3">
                <label class="form-label">Driving License Number</label>
                <input type="text" class="form-control" id="licenseNo" required>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">License Expiry Date</label>
                <input type="date" class="form-control" id="licenseExpiry" required>
              </div>
              <div class="col-md-4 mb-3">
                <label class="form-label">Upload License Photo</label>
                <input type="file" class="form-control" id="licensePhoto" accept="image/*,application/pdf">
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Vehicle Types (e.g. Truck, Bus)</label>
                <input type="text" class="form-control" id="vehicleTypes" placeholder="Truck, Van, LCV">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Years of Experience</label>
                <input type="number" class="form-control" id="experience" min="0" value="0">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Languages Known</label>
                <input type="text" class="form-control" id="languages" placeholder="English, Hindi, etc.">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Preferred Location</label>
                <input type="text" class="form-control" id="location">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Expected Salary (₹)</label>
                <input type="number" class="form-control" id="salary" min="0">
              </div>
            </div>

            <h5 class="border-bottom pb-2 mb-3 mt-4">Previous Experience Details</h5>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Previous Transport Company Name</label>
                <input type="text" class="form-control" id="prevCompanyName">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Previous Vehicle Owner Name</label>
                <input type="text" class="form-control" id="prevOwnerName">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Employment Period (From - To)</label>
                <input type="text" class="form-control" id="prevEmploymentPeriod" placeholder="e.g. Jan 2021 - Mar 2024">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Reason for Leaving</label>
                <input type="text" class="form-control" id="reasonForLeaving">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Reference Contact Number</label>
                <input type="tel" class="form-control" id="refContact">
              </div>
              <div class="col-md-6 mb-3 d-flex align-items-end pb-2">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="refConsent">
                  <label class="form-check-label text-muted small" for="refConsent">
                    Allow owners to view reference contact number
                  </label>
                </div>
              </div>
            </div>

            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary btn-lg" id="submitBtn">
                Register as Driver
                <span id="spinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
              </button>
            </div>
            
            <div class="text-center mt-3">
              <a href="index.html" class="text-decoration-none">Back to Login</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const spinner = document.getElementById('spinner');
      const errorAlert = document.getElementById('errorAlert');
      const successAlert = document.getElementById('successAlert');
      
      btn.disabled = true;
      spinner.classList.remove('d-none');
      errorAlert.classList.add('d-none');
      successAlert.classList.add('d-none');

      const formData = new FormData();
      formData.append('username', document.getElementById('username').value);
      formData.append('password', document.getElementById('password').value);
      formData.append('full_name', document.getElementById('fullName').value);
      formData.append('mobile_number', document.getElementById('mobile').value);
      formData.append('address', document.getElementById('address').value);
      formData.append('driving_license_number', document.getElementById('licenseNo').value);
      formData.append('license_expiry_date', document.getElementById('licenseExpiry').value);
      formData.append('vehicle_types', document.getElementById('vehicleTypes').value);
      formData.append('years_of_experience', document.getElementById('experience').value);
      formData.append('languages_known', document.getElementById('languages').value);
      formData.append('preferred_location', document.getElementById('location').value);
      formData.append('expected_salary', document.getElementById('salary').value);
      formData.append('prev_company_name', document.getElementById('prevCompanyName').value);
      formData.append('prev_owner_name', document.getElementById('prevOwnerName').value);
      formData.append('prev_employment_period', document.getElementById('prevEmploymentPeriod').value);
      formData.append('reason_for_leaving', document.getElementById('reasonForLeaving').value);
      formData.append('reference_contact_number', document.getElementById('refContact').value);
      formData.append('reference_consent', document.getElementById('refConsent').checked);

      const profilePhoto = document.getElementById('profilePhoto').files[0];
      if (profilePhoto) formData.append('profile_photo', profilePhoto);

      const licensePhoto = document.getElementById('licensePhoto').files[0];
      if (licensePhoto) formData.append('license_photo', licensePhoto);

      try {
        const res = await fetch(`${API_BASE_URL}/api/drivers/register`, {
          method: 'POST',
          body: formData // No Content-Type header needed for FormData
        });
        const data = await res.json();
        
        if (res.ok) {
          successAlert.textContent = 'Registration successful! Redirecting to login...';
          successAlert.classList.remove('d-none');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 2000);
        } else {
          errorAlert.textContent = data.message || 'Registration failed';
          errorAlert.classList.remove('d-none');
          btn.disabled = false;
        }
      } catch (err) {
        errorAlert.textContent = 'Server connection failed';
        errorAlert.classList.remove('d-none');
        btn.disabled = false;
      } finally {
        spinner.classList.add('d-none');
      }
    });
  </script>
</body>
</html>
