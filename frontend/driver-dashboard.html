<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Dashboard — Fleet Management System</title>
  
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background-color: var(--bg-color); }
    .top-navbar { background-color: var(--navbar-bg); border-bottom: 1px solid var(--border-color); }
    .driver-avatar { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; }
    .status-badge { font-size: 0.9rem; }
  </style>
</head>
<body>
  
  <nav class="navbar navbar-expand-lg top-navbar px-4 py-3 sticky-top">
    <div class="d-flex align-items-center w-100 justify-content-between">
      <div class="d-flex align-items-center">
        <i class="bi bi-person-badge fs-3 text-primary me-2"></i>
        <h4 class="mb-0 fw-bold">Driver Portal</h4>
      </div>
      
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-light border rounded-circle p-2" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme">
          <i class="bi bi-sun-fill text-secondary" id="themeIcon"></i>
        </button>
        <button class="btn btn-outline-danger" onclick="logout()">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <ul class="nav nav-tabs mb-4" id="driverTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active fw-semibold" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile-tab-pane" type="button" role="tab"><i class="bi bi-person me-2"></i>My Profile</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link fw-semibold" id="requests-tab" data-bs-toggle="tab" data-bs-target="#requests-tab-pane" type="button" role="tab"><i class="bi bi-envelope me-2"></i>Job Applications</button>
      </li>
    </ul>
    
    <div class="tab-content" id="driverTabContent">
      <!-- Profile Tab -->
      <div class="tab-pane fade show active" id="profile-tab-pane" role="tabpanel" tabindex="0">
        <div class="row">
          <div class="col-md-4 mb-4">
            <div class="card glass-panel fade-in-up text-center p-4">
              <img src="images/truck.jpg" class="driver-avatar mx-auto mb-3" alt="Driver Avatar" id="profPic">
              <h4 class="fw-bold mb-1" id="profName">Loading...</h4>
              <p class="text-muted mb-2"><i class="bi bi-telephone-fill me-2"></i><span id="profMobile"></span></p>
              
              <div class="d-flex justify-content-center align-items-center mb-3">
                <span class="badge bg-success rounded-pill status-badge" id="profAvailability">Available</span>
              </div>
              
              <div class="mt-3">
                <label class="form-label fw-semibold text-secondary small">Update Availability</label>
                <select class="form-select" id="availabilitySelect" onchange="updateAvailability()">
                  <option value="Available">Available</option>
                  <option value="On Duty">On Duty</option>
                  <option value="Not Looking for Job">Not Looking for Job</option>
                </select>
              </div>
            </div>
          </div>
          
          <div class="col-md-8">
            <div class="card glass-panel fade-in-up p-4">
              <h5 class="fw-bold border-bottom pb-2 mb-3">Professional Details</h5>
              
              <div class="row mb-3">
                <div class="col-sm-4 text-muted fw-semibold">License Number</div>
                <div class="col-sm-8" id="profLicense"></div>
              </div>
              <div class="row mb-3">
                <div class="col-sm-4 text-muted fw-semibold">License Expiry</div>
                <div class="col-sm-8" id="profExpiry"></div>
              </div>
              <div class="row mb-3">
                <div class="col-sm-4 text-muted fw-semibold">Vehicle Types</div>
                <div class="col-sm-8" id="profVehicles"></div>
              </div>
              <div class="row mb-3">
                <div class="col-sm-4 text-muted fw-semibold">Experience</div>
                <div class="col-sm-8" id="profExp"></div>
              </div>
              <div class="row mb-3">
                <div class="col-sm-4 text-muted fw-semibold">Languages</div>
                <div class="col-sm-8" id="profLang"></div>
              </div>
              <div class="row mb-3">
                <div class="col-sm-4 text-muted fw-semibold">Expected Salary</div>
                <div class="col-sm-8" id="profSalary"></div>
              </div>
              <div class="row mb-3">
                <div class="col-sm-4 text-muted fw-semibold">Location</div>
                <div class="col-sm-8" id="profLocation"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Applications Tab -->
      <div class="tab-pane fade" id="requests-tab-pane" role="tabpanel" tabindex="0">
        <div class="card glass-panel fade-in-up p-4">
          <h5 class="fw-bold mb-4">Job Requests from Owners</h5>
          
          <div id="requestsList" class="d-flex flex-column gap-3">
            <!-- Populated via JS -->
          </div>
          
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script>
    function getToken() {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = 'index.html';
      }
      return token;
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      window.location.href = 'index.html';
    }

    async function loadProfile() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/drivers/profile`, {
          headers: { 'Authorization': `Bearer ${getToken()}` }
        });
        if (!res.ok) throw new Error('Failed to load profile');
        const data = await res.json();
        const p = data.profile;
        
        document.getElementById('profName').textContent = p.full_name;
        document.getElementById('profMobile').textContent = p.mobile_number;
        document.getElementById('profLicense').textContent = p.driving_license_number || '-';
        document.getElementById('profExpiry').textContent = p.license_expiry_date ? new Date(p.license_expiry_date).toLocaleDateString() : '-';
        document.getElementById('profVehicles').textContent = p.vehicle_types || '-';
        document.getElementById('profExp').textContent = p.years_of_experience + ' Years';
        document.getElementById('profLang').textContent = p.languages_known || '-';
        document.getElementById('profSalary').textContent = p.expected_salary ? '₹' + p.expected_salary : '-';
        document.getElementById('profLocation').textContent = p.preferred_location || '-';
        
        document.getElementById('profAvailability').textContent = p.availability;
        document.getElementById('availabilitySelect').value = p.availability;
        
        if (p.availability === 'Available') {
          document.getElementById('profAvailability').className = 'badge bg-success rounded-pill status-badge';
        } else if (p.availability === 'On Duty') {
          document.getElementById('profAvailability').className = 'badge bg-warning text-dark rounded-pill status-badge';
        } else {
          document.getElementById('profAvailability').className = 'badge bg-secondary rounded-pill status-badge';
        }
        
      } catch (err) {
        console.error(err);
      }
    }

    async function updateAvailability() {
      const val = document.getElementById('availabilitySelect').value;
      try {
        await fetch(`${API_BASE_URL}/api/drivers/profile/availability`, {
          method: 'PUT',
          headers: { 
            'Authorization': `Bearer ${getToken()}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ availability: val })
        });
        loadProfile();
      } catch (err) {
        console.error(err);
        alert('Failed to update availability');
      }
    }

    async function loadRequests() {
      try {
        const res = await fetch(`${API_BASE_URL}/api/jobs/requests`, {
          headers: { 'Authorization': `Bearer ${getToken()}` }
        });
        const data = await res.json();
        const container = document.getElementById('requestsList');
        
        if (data.requests.length === 0) {
          container.innerHTML = '<div class="text-muted text-center py-4">No job requests yet.</div>';
          return;
        }

        container.innerHTML = data.requests.map(req => {
          let actionBtns = '';
          if (req.status === 'waiting') {
            actionBtns = `
              <button class="btn btn-success btn-sm me-2" onclick="updateReqStatus(${req.id}, 'accepted')"><i class="bi bi-check-lg me-1"></i>Accept</button>
              <button class="btn btn-outline-danger btn-sm" onclick="updateReqStatus(${req.id}, 'rejected')"><i class="bi bi-x-lg me-1"></i>Reject</button>
            `;
          } else if (req.status === 'accepted') {
            actionBtns = `<span class="badge bg-success">Accepted</span>`;
          } else {
            actionBtns = `<span class="badge bg-danger">Rejected</span>`;
          }

          return `
            <div class="border rounded p-3 d-flex justify-content-between align-items-center">
              <div>
                <h6 class="fw-bold mb-1">Owner: ${req.owner_name || req.owner_username}</h6>
                <p class="text-dark fw-semibold small mb-1"><i class="bi bi-telephone-fill me-2 text-primary"></i>${req.owner_phone || 'No phone provided'}</p>
                <p class="text-muted mb-0 small"><i class="bi bi-chat-left-text me-2"></i>${req.message || 'No message provided'}</p>
                <div class="small text-secondary mt-1"><i class="bi bi-clock me-1"></i>${new Date(req.created_at).toLocaleString()}</div>
              </div>
              <div class="text-end">
                ${actionBtns}
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function updateReqStatus(id, status) {
      if (!confirm(`Are you sure you want to ${status} this request?`)) return;
      try {
        await fetch(`${API_BASE_URL}/api/jobs/request/${id}`, {
          method: 'PUT',
          headers: { 
            'Authorization': `Bearer ${getToken()}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ status })
        });
        loadRequests();
      } catch (err) {
        console.error(err);
        alert('Failed to update status');
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-bs-theme') || 'light';
      const nxt = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-bs-theme', nxt);
      localStorage.setItem('theme', nxt);
      document.getElementById('themeIcon').className = nxt === 'dark' ? 'bi bi-moon-stars-fill text-warning' : 'bi bi-sun-fill text-secondary';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const t = localStorage.getItem('theme') || 'light';
      document.getElementById('themeIcon').className = t === 'dark' ? 'bi bi-moon-stars-fill text-warning' : 'bi bi-sun-fill text-secondary';
      
      const user = JSON.parse(localStorage.getItem('user'));
      if (!user || user.role !== 'driver') {
        window.location.href = 'index.html';
      }

      loadProfile();
      loadRequests();
    });
  </script>
</body>
</html>
