<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fleet Management System - Login</title>
  
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || 'light';
      document.documentElement.setAttribute('data-bs-theme', theme);
    })();
  </script>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      background: linear-gradient(rgba(15, 23, 42, 0.7), rgba(15, 23, 42, 0.8)), url('images/truck.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    
    .login-card {
      border: none;
      border-radius: 1.25rem;
      overflow: hidden;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }
    
    .login-image {
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.85) 0%, rgba(6, 182, 212, 0.85) 100%);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 3rem;
      text-align: center;
      position: relative;
    }
    
    .login-image::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: url('images/portfolio-bg.png') center/cover;
      opacity: 0.1;
      z-index: 0;
    }
    
    .login-image > * {
      z-index: 1;
    }
    
    .login-form-wrapper {
      background-color: transparent;
    }
    
    .nav-pills .nav-link {
      color: var(--text-color);
      transition: all 0.3s ease;
      background: rgba(100, 116, 139, 0.1);
    }
    
    .nav-pills .nav-link:hover {
      background: rgba(79, 70, 229, 0.15);
    }
    
    @media (max-width: 768px) {
      .login-form-wrapper {
        padding: 2rem 1.5rem !important;
      }
    }
  </style>
</head>
<body>
  
  <!-- Floating Theme Toggle Button -->
  <button class="btn btn-light border position-fixed" id="themeToggleBtn" onclick="toggleTheme()" style="top: 20px; right: 20px; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; z-index: 1000;" title="Toggle Light/Dark Mode">
    <i class="bi bi-sun-fill text-secondary" id="themeIcon"></i>
  </button>

  <div class="container fade-in-up">
    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card login-card glass-panel d-flex flex-column flex-md-row">
          
          <!-- Left side: Branding -->
          <div class="col-md-5 d-none d-md-flex login-image">
            <img src="images/hub-logo.png" alt="Transport Hub Logo" style="width: 150px; margin-bottom: 20px; border-radius: 10px;">
            <h3 class="fw-bold mb-2">Transport Hub</h3>
            <p class="text-white-50">Professional vehicle tracking and maintenance system.</p>
          </div>
          
          <!-- Right side: Login Form -->
          <div class="col-md-7 login-form-wrapper p-4 p-md-5">
            <!-- Role Toggle Pills -->
            <ul class="nav nav-pills mb-4 justify-content-center d-flex flex-nowrap" id="roleTab" role="tablist" style="gap: 5px;">
              <li class="nav-item flex-fill" role="presentation">
                <button class="nav-link active w-100 fw-semibold text-center rounded-pill px-1" id="owner-tab" data-bs-toggle="pill" type="button" onclick="setRole('owner')"><i class="bi bi-person-badge d-block d-sm-inline me-sm-1"></i>Owner</button>
              </li>
              <li class="nav-item flex-fill" role="presentation">
                <button class="nav-link w-100 fw-semibold text-center rounded-pill px-1" id="driver-tab" data-bs-toggle="pill" type="button" onclick="setRole('driver')"><i class="bi bi-truck d-block d-sm-inline me-sm-1"></i>Driver</button>
              </li>
              <li class="nav-item flex-fill" role="presentation">
                <button class="nav-link w-100 fw-semibold text-center rounded-pill px-1" id="jobseeker-tab" data-bs-toggle="pill" type="button" onclick="setRole('jobseeker')"><i class="bi bi-search d-block d-sm-inline me-sm-1"></i>Hire Jobs</button>
              </li>
            </ul>

            <div class="mb-4 text-center text-md-start">
              <h2 class="fw-bold text-dark mb-1" id="formTitle">Welcome Owner</h2>
              <p class="text-muted" id="formSubTitle">Sign in to manage your vehicles & drivers</p>
            </div>
            
            <form id="loginForm">
              
              <!-- Error Alert -->
              <div id="loginError" class="alert alert-danger d-none py-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span id="loginErrorText"></span>
              </div>

              <div class="mb-3">
                <label for="username" id="usernameLabel" class="form-label fw-semibold text-secondary">Email / Username</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                  <input type="text" class="form-control border-start-0 ps-0" id="username" placeholder="Enter email or username" required>
                </div>
              </div>
              
              <div class="mb-4">
                <label for="password" class="form-label fw-semibold text-secondary">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                  <input type="password" class="form-control border-start-0 ps-0 border-end-0" id="password" placeholder="Enter password" required>
                  <button class="btn btn-outline-secondary bg-light border-start-0" type="button" id="togglePassword">
                    <i class="bi bi-eye text-muted"></i>
                  </button>
                </div>
              </div>
              
              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg" id="loginBtn">
                  <span id="loginBtnText">Sign In</span>
                  <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
                </button>
              </div>

              <div class="mt-3 text-center" id="toggleLinkContainer">
                <a href="#" onclick="toggleMode(); return false;" class="text-decoration-none fw-semibold">Don't have an account? Register here</a>
              </div>
              
              <div class="mt-4 p-3 bg-light rounded text-center" id="defaultCredsBox">
                <small class="text-muted">
                  Default credentials:<br>
                  Username: <strong>owner</strong> | Password: <strong>owner123</strong>
                </small>
              </div>
              
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script>
    // Redirect if already logged in
    if (localStorage.getItem('token')) {
      window.location.href = 'dashboard.html';
    }

    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');
    let currentRole = 'owner'; // 'owner' or 'driver'
    let isRegister = false;    // register mode for owner

    togglePassword.addEventListener('click', function () {
      const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
      password.setAttribute('type', type);
      this.querySelector('i').classList.toggle('bi-eye');
      this.querySelector('i').classList.toggle('bi-eye-slash');
    });

    function setRole(role) {
      currentRole = role;
      isRegister = false;
      
      // Update pills active states
      if (role === 'owner') {
        document.getElementById('owner-tab').classList.add('active');
        document.getElementById('driver-tab').classList.remove('active');
        document.getElementById('jobseeker-tab').classList.remove('active');
      } else if (role === 'driver') {
        document.getElementById('owner-tab').classList.remove('active');
        document.getElementById('driver-tab').classList.add('active');
        document.getElementById('jobseeker-tab').classList.remove('active');
      } else {
        document.getElementById('owner-tab').classList.remove('active');
        document.getElementById('driver-tab').classList.remove('active');
        document.getElementById('jobseeker-tab').classList.add('active');
      }
      
      updateUI();
    }

    function toggleMode() {
      isRegister = !isRegister;
      updateUI();
    }

    function updateUI() {
      const formTitle = document.getElementById('formTitle');
      const formSubTitle = document.getElementById('formSubTitle');
      const usernameLabel = document.getElementById('usernameLabel');
      const usernameInput = document.getElementById('username');
      const loginBtnText = document.getElementById('loginBtnText');
      const toggleLinkContainer = document.getElementById('toggleLinkContainer');
      const defaultCredsBox = document.getElementById('defaultCredsBox');

      // Clear any errors
      document.getElementById('loginError').classList.add('d-none');

      if (currentRole === 'jobseeker') {
        formTitle.textContent = 'Job Portal';
        formSubTitle.textContent = 'Sign in to find driving jobs';
        usernameLabel.textContent = 'Email / Username';
        usernameInput.placeholder = 'e.g. driver_john';
        loginBtnText.textContent = 'Sign In to Jobs Portal';
        toggleLinkContainer.classList.remove('d-none');
        toggleLinkContainer.innerHTML = `<a href="driver-register.html" class="text-decoration-none fw-semibold">Looking for a driving job? Register here</a>`;
        defaultCredsBox.classList.add('d-none');
      } else if (currentRole === 'driver') {
        formTitle.textContent = 'Driver Access';
        formSubTitle.textContent = 'Sign in to view your assigned vehicle';
        usernameLabel.textContent = 'Driver ID';
        usernameInput.placeholder = 'e.g. driver_john';
        loginBtnText.textContent = 'Sign In as Driver';
        toggleLinkContainer.classList.add('d-none');
        defaultCredsBox.classList.remove('d-none');
        defaultCredsBox.innerHTML = `
          <small class="text-muted">
            Default credentials:<br>
            Username: <strong>driver</strong> | Password: <strong>driver123</strong>
          </small>
        `;
      } else {
        // Owner role
        if (isRegister) {
          formTitle.textContent = 'Create Owner Account';
          formSubTitle.textContent = 'Register to start managing your fleet';
          usernameLabel.textContent = 'Email / Username';
          usernameInput.placeholder = 'Enter your email address';
          loginBtnText.textContent = 'Register & Sign Up';
          toggleLinkContainer.classList.remove('d-none');
          toggleLinkContainer.innerHTML = `<a href="#" onclick="toggleMode(); return false;" class="text-decoration-none fw-semibold">Already have an account? Sign In</a>`;
          defaultCredsBox.classList.add('d-none');
        } else {
          formTitle.textContent = 'Welcome Owner';
          formSubTitle.textContent = 'Sign in to manage your vehicles & drivers';
          usernameLabel.textContent = 'Email / Username';
          usernameInput.placeholder = 'Enter email or username';
          loginBtnText.textContent = 'Sign In';
          toggleLinkContainer.classList.remove('d-none');
          toggleLinkContainer.innerHTML = `<a href="#" onclick="toggleMode(); return false;" class="text-decoration-none fw-semibold">Don't have an account? Register here</a>`;
          defaultCredsBox.classList.remove('d-none');
          defaultCredsBox.innerHTML = `
            <small class="text-muted">
              Default credentials:<br>
              Username: <strong>owner</strong> | Password: <strong>owner123</strong>
            </small>
          `;
        }
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const errBox = document.getElementById('loginError');
      const errText = document.getElementById('loginErrorText');
      const btn = document.getElementById('loginBtn');
      const spinner = document.getElementById('loginSpinner');
      const btnText = document.getElementById('loginBtnText');

      errBox.classList.add('d-none');
      btn.disabled = true;
      spinner.classList.remove('d-none');
      
      const savedText = btnText.textContent;
      btnText.textContent = isRegister ? 'Registering...' : 'Authenticating...';

      try {
        const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';
        const res = await fetch(`${API_BASE_URL}${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: u, password: p })
        });
        
        const data = await res.json();
        
        if (res.ok) {
          if (isRegister) {
            isRegister = false;
            updateUI();
            errText.textContent = 'Registration successful! Please sign in.';
            errBox.classList.remove('alert-danger');
            errBox.classList.add('alert-success');
            errBox.classList.remove('d-none');
          } else {
            localStorage.setItem('token', data.token);
            localStorage.setItem('user', JSON.stringify(data.user));
            
            if (data.user.role === 'driver') {
              if (data.user.owner_id) {
                // Driver is already hired and assigned to an owner
                window.location.href = 'dashboard.html';
              } else {
                // Driver is an independent job seeker
                window.location.href = 'driver-dashboard.html';
              }
            } else {
              window.location.href = 'dashboard.html';
            }
          }
        } else {
          errBox.classList.remove('alert-success');
          errBox.classList.add('alert-danger');
          errText.textContent = data.message || 'Action failed';
          errBox.classList.remove('d-none');
        }
      } catch(err) {
        errBox.classList.remove('alert-success');
        errBox.classList.add('alert-danger');
        errText.textContent = 'Server connection failed.';
        errBox.classList.remove('d-none');
      } finally {
        btn.disabled = false;
        spinner.classList.add('d-none');
        btnText.textContent = savedText;
      }
    });

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-bs-theme', theme);
      localStorage.setItem('theme', theme);
      const icon = document.getElementById('themeIcon');
      if (icon) {
        if (theme === 'dark') {
          icon.className = 'bi bi-moon-stars-fill text-warning';
        } else {
          icon.className = 'bi bi-sun-fill text-secondary';
        }
      }
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-bs-theme') || 'light';
      applyTheme(current === 'dark' ? 'light' : 'dark');
    }

    // Init theme on load
    applyTheme(localStorage.getItem('theme') || 'light');
  </script>
</body>
</html>
